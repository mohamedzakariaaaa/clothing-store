<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="description" content="SeefStore — sportswear and casual wear made to move." />
    <title>Shop — SeefStore</title>
    <script>
      try {
        var lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2);
        if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
    <link rel="icon" href="/images/favicon.png" type="image/png" />
  </head>
  <body>
    <header class="nav" id="site-header"></header>

    <main class="section page">
      <h1 data-i18n="shop.title">Shop</h1>
      <!-- Category chips on one side, sort pill on the other -->
      <div class="toolbar-row">
        <div class="filters" id="filters" role="group"></div>
        <div class="sort">
          <select id="sort" data-i18n-label="shop.sort">
            <option value="new" data-i18n="shop.sort.new">Newest</option>
            <option value="low" data-i18n="shop.sort.low">Price: low to high</option>
            <option value="high" data-i18n="shop.sort.high">Price: high to low</option>
          </select>
        </div>
      </div>
      <div class="grid" id="shop-grid"></div>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script type="module" src="/src/shop.js"></script>
  </body>
</html>
