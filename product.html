<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="description" content="SeefStore — sportswear and casual wear made to move." />
    <title>SeefStore</title>
    <script>
      try {
        var lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2);
        if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
    <link rel="icon" href="/images/favicon.png" type="image/png" />
  </head>
  <body>
    <header class="nav" id="site-header"></header>

    <main class="section page">
      <a href="/shop.html" class="back" data-i18n="product.back">← Back to shop</a>
      <div id="product"></div>
    </main>

    <!-- "Added to cart" notice -->
    <div class="toast" id="toast" role="status" hidden>
      <span data-i18n="product.added">Added to cart</span>
      <a href="/cart.html" data-i18n="product.viewCart">View cart</a>
    </div>

    <footer class="footer" id="site-footer"></footer>
    <script type="module" src="/src/product.js"></script>
  </body>
</html>
