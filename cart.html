<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="description" content="SeefStore — sportswear and casual wear made to move." />
    <meta name="robots" content="noindex" />
    <title>Cart — SeefStore</title>
    <script>
      try {
        var lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2);
        if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
    <link rel="icon" href="/images/favicon.png" type="image/png" />
  </head>
  <body>
    <header class="nav" id="site-header"></header>

    <main class="section page">
      <h1 data-i18n="cart.title">Your cart</h1>
      <div id="cart"></div>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script type="module" src="/src/checkout.js"></script>
  </body>
</html>
